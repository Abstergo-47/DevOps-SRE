name: Pull Request CI

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ test/ --max-line-length=120 --count --show-source --statistics

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest test/ -v

  build-and-scan:
    name: Build & scan (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs:
      - lint
      - sast
      - unit-tests
    strategy:
      matrix:
        include:
          - { version: v1, python: "3.12" }
          - { version: v2, python: "3.13" }
          - { version: v3, python: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: PYTHON_VERSION=${{ matrix.python }}
          tags: python-app:pr-${{ github.event.pull_request.number }}-${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: python-app:pr-${{ github.event.pull_request.number }}-${{ matrix.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # Matrix checks get suffixed names, so this job provides the single required check name.
  build-gate:
    name: Build image & vulnerability scan
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - run: echo "all image builds and scans passed"
