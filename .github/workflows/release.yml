name: Release CI

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "Dockerfile"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, push & update manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/python-app:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in deployment
        run: sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${IMAGE}|" kubernetes/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/deployment.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: update image to ${IMAGE##*:} [skip ci]"
          git push
