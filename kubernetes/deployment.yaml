apiVersion: apps/v1
kind: Deployment
metadata:
  name: v1
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
      version: v1
  template:
    metadata:
      labels:
        app: python-app
        version: v1
    spec:
      containers:
        - name: python-app
          image: ghcr.io/abstergo-47/python-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080

