apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-ingress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: python-app
  policyTypes:
    - Ingress
  ingress:
    - from: []
      ports:
        - port: 8080
          protocol: TCP
